name: Waldo
description: >-
  Waldo is a no-code mobile test automation platform for iOS and Android that lets any team member
  create, run, and maintain reliable end-to-end tests on a cloud of virtual devices (iOS simulators
  and Android emulators) with zero device setup. Its Scripting (Core) API exposes a W3C WebDriver
  and Appium-compatible endpoint at core.waldo.com so engineers can programmatically create sessions
  on cloud devices and drive native, hybrid, and mobile-web apps, capturing video replays, logs, and
  network calls. Build upload runs through a Go CLI, GitHub Actions, Bitrise, and a fastlane plugin.
  Waldo was acquired by Tricentis in July 2023 and is part of the Tricentis mobile testing portfolio.
